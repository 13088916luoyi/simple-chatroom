<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>聊天室</title>
    <script src="/src/socket.io.min.js"></script>
    <link rel="stylesheet" href="/src/chat.css">
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <h1>在线聊天室</h1>
            <div class="current-chat" id="currentChat">公共聊天室</div>
            <div class="user-info">
                <span class="online-count" id="onlineCount">在线: 0 人</span>
                <button class="logout-btn" onclick="logout()">退出登录</button>
            </div>
        </div>
        <div class="chat-main">
            <div class="sidebar">
                <div class="sidebar-header">聊天列表</div>
                <div class="chat-rooms">
                    <div class="room-item active" id="publicRoom" onclick="switchToPublic()">
                        <div class="room-icon">公</div>
                        <span class="room-name">公共聊天室</span>
                    </div>
                </div>
                <div class="sidebar-header">在线用户</div>
                <div class="user-list" id="userList"></div>
            </div>
            <div class="chat-area">
                <div class="messages-container" id="messagesContainer"></div>
                <div class="input-area">
                    <div class="input-toolbar">
                        <button class="toolbar-btn" onclick="toggleEmojiPicker()" title="表情">😊</button>
                        <button class="toolbar-btn" onclick="document.getElementById('imageInput').click()" title="图片">🖼️</button>
                        <input type="file" id="imageInput" accept="image/*" style="display: none;" onchange="handleImageSelect(event)">
                    </div>
                    <form class="input-form" onsubmit="sendMessage(event)">
                        <input type="text" id="messageInput" placeholder="输入消息..." autocomplete="off">
                        <button type="submit">发送</button>
                    </form>
                    <div class="emoji-picker" id="emojiPicker">
                        <div class="emoji-tabs">
                            <span class="emoji-tab active" onclick="switchEmojiTab('smileys')">表情</span>
                            <span class="emoji-tab" onclick="switchEmojiTab('symbols')">符号</span>
                        </div>
                        <div class="emoji-grid" id="emojiGrid"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="image-preview" id="imagePreview" onclick="closeImagePreview()">
        <span class="close-btn">&times;</span>
        <img src="" alt="预览" id="previewImg">
    </div>

    <script src="/src/chat.js"></script>
</body>
</html>
